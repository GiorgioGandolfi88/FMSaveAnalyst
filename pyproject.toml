[project]
name = "fmsa"
dynamic = ["version"]
description = "FMSaveAnalyst: local, read-only analysis of Football Manager 26/27 saves"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fmsave==0.12.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pywebview>=5.3",
    "anthropic>=2.8.0",
    "openai>=3.49.0",
    "google-genai>=3.2.0",
    "keyring>=25.7.0",
]

[project.scripts]
fmsa = "fmsa.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pyinstaller>=6.11",
    "psutil>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "backend/fmsa/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/fmsa"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "spikes", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["backend/fmsa"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
