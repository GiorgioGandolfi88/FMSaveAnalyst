name: Release

# Push a tag like v0.2.0 (matching __version__ in backend/fmsa/__init__.py) to publish
# FMSaveAnalyst-<version>-win64.zip as a GitHub release. The app's update check reads it.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check tag matches version
        shell: pwsh
        run: |
          $version = (Select-String -Path backend/fmsa/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match __version__ $version"
            exit 1
          }

      - name: Install and test
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Build
        run: uv run python scripts/build.py

      - name: Self-test executable
        shell: pwsh
        run: |
          $p = Start-Process dist/FMSaveAnalyst/FMSaveAnalyst.exe -ArgumentList '--self-test' -Wait -PassThru
          exit $p.ExitCode

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            (Get-ChildItem dist/FMSaveAnalyst-*-win64.zip*).FullName `
            --title "FMSaveAnalyst ${{ github.ref_name }}" `
            --generate-notes
