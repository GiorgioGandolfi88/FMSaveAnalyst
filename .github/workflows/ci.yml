name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Lint and type-check (Python)
        run: |
          uv run ruff check backend spikes scripts reference
          uv run ruff format --check backend spikes scripts reference
          uv run pyright

      - name: Tests
        run: uv run pytest -q

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build portable executable
        run: uv run python scripts/build.py --skip-frontend

      - name: Self-test executable
        shell: pwsh
        run: |
          $p = Start-Process dist/FMSaveAnalyst/FMSaveAnalyst.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content "$env:APPDATA/FMSaveAnalyst/logs/fmsa.log"
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: FMSaveAnalyst-win64
          path: |
            dist/FMSaveAnalyst-*-win64.zip
            dist/FMSaveAnalyst-*-win64.zip.sha256
          retention-days: 14
